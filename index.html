.row{grid-template-columns:80px minmax(0,1fr) auto}
.wrap{padding:0 20px}
.hd{padding-top:24px;padding-bottom:16px}
.tabs{gap:16px}
.view{padding-top:24px;padding-bottom:56px}
.wv{padding:0}
.stage{--w:88vw;--h:calc(var(--w) * 1.78)}
.card{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:18px;padding:24px 0 0 24px;border-radius:24px}
.cl-txt{flex:none;overflow:visible}
.csum{-webkit-line-clamp:3}
.cstack{display:none}
.shot.rq{padding:22px}
.rq-q{height:auto;margin-bottom:16px}
.rqf p{-webkit-line-clamp:7;font-size:14px}
.cl-l{padding:0 24px 0 0;gap:18px}
.ctitle{font-size:28px}
.shot{padding:24px}
.rqq{font-size:21px}
.ph{padding:0 20px}
.ph h2{font-size:34px}
.tools-s{margin-top:64px}
.tlw{padding:12px 20px;margin:0 -20px}
.tlw::-webkit-scrollbar{display:none}
.tlh{grid-template-columns:repeat(7,minmax(150px,1fr));min-width:1050px}
.pcard{flex-direction:column}
.pimg{flex:none;min-height:180px}
.row{grid-template-columns:84px minmax(0,1fr) auto}
}

</head>
<body>
<div id="root"></div>
<template id="dc-template">
<div class="pg {{ fontClass }}" data-instant="{{ instant }}">

<header class="wrap hd">
<span class="name">Felicia Chen</span>
<nav class="tabs" role="tablist" aria-label="Sections">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
<button type="button" class="btn tab press" role="tab" id="{{ t.tid }}" aria-selected="{{ t.sel }}" aria-controls="panel" onClick="{{ t.go }}">{{ t.label }}</button>
</sc-for>
</nav>
</header>

<sc-if value="{{ isAbout }}" hint-placeholder-val="{{ true }}">
<main class="view" id="panel" role="tabpanel" aria-labelledby="tab-about">
<div class="ph">
<div><div class="ph-l dim">About</div><h2>Hi! I’m Felicia,</h2></div>
<div class="ph-r">
<a class="icob press" href="https://www.linkedin.com/in/felicia-juliana-chen-a20583235/" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn"><img src="assets/img/linkedin.png" alt="" width="22" height="22"></a>
<a class="icob press" href="https://github.com/feliciachen01" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub"><img src="assets/img/github.png" alt="" width="20" height="20"></a>
<button type="button" class="btn icob press" aria-label="Open the secret tab" title="Psst" onClick="{{ openSecret }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4c.6 4.3 2.7 6.4 7 7-4.3.6-6.4 2.7-7 7-.6-4.3-2.7-6.4-7-7 4.3-.6 6.4-2.7 7-7z"></path><path d="M19 3v3"></path><path d="M17.5 4.5h3"></path></svg></button>
</div>
</div>
<div class="col">
<div class="card2 about">
<div>
<p>A senior at the University of British Columbia.</p>
<p style="margin-top: 14px">I’m interested in the nature of intelligence, particularly personal agents, embodied AI, and how intelligent systems can interact with the physical world.</p>
<dl class="facts">
<div><dt class="dim">Now</dt><dd>AI Engineer Intern, TSV Capital</dd></div>
<div><dt class="dim">Studying</dt><dd>BSc Computer Science, UBC ’27</dd></div>
</dl>
</div>
<img class="portrait" ref="{{ setPortrait }}" src="assets/img/portrait.jpg" alt="Felicia Chen">
</div>
</div>
</main>
</sc-if>

<sc-if value="{{ isWork }}" hint-placeholder-val="{{ false }}">
<main class="view wv" id="panel" role="tabpanel" aria-labelledby="tab-work">
<div class="ph">
<div><div class="ph-l dim">Selected work</div><h2>Projects</h2></div>
<a class="vall press" href="https://github.com/feliciachen01" target="_blank" rel="noopener">View all</a>
</div>
<div class="stage" ref="{{ setStage }}" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Projects. Use the left and right arrow keys to browse.">
<div class="track" ref="{{ setTrack }}">
<sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
<div class="card" aria-hidden="{{ c.hidden }}">
<div class="cl-l">
<div class="cl-txt">
<h3 class="ctitle">{{ c.title }}</h3>
<div class="csub dim">{{ c.sub }}</div>
<p class="csum dim">{{ c.sum }}</p>
<div class="cstack dim">{{ c.stack }}</div>
</div>
<sc-if value="{{ c.live }}" hint-placeholder-val="{{ true }}"><a class="more press" href="{{ c.href }}" target="_blank" rel="noopener" tabindex="{{ c.tab }}" style="background: {{ c.color }}">{{ c.cta }}</a></sc-if>
<sc-if value="{{ c.wip }}" hint-placeholder-val="{{ false }}"><span class="more wip" style="color: {{ c.color }}; box-shadow: inset 0 0 0 1.5px {{ c.color }}"><span class="wdot" style="background: {{ c.color }}" aria-hidden="true"></span>In progress</span></sc-if>
</div>
<sc-if value="{{ c.hasImg }}" hint-placeholder-val="{{ false }}">
<div class="{{ c.shotCls }}"><img src="{{ c.img }}" alt="{{ c.imgAlt }}" draggable="false"></div>
</sc-if>
<sc-if value="{{ c.noImg }}" hint-placeholder-val="{{ true }}">
<div class="shot rq">
<div class="rq-q"><div class="ph-l dim">{{ c.qLabel }}</div><p class="rqq">{{ c.q }}</p></div>
<div class="rqf"><div class="ph-l dim">{{ c.fLabel }}</div><p>{{ c.finding }}</p></div>
</div>
</sc-if>
<button type="button" class="btn hit" tabindex="-1" aria-hidden="true" onClick="{{ c.go }}"></button>
</div>
</sc-for>
</div>
</div>
<div class="dots" role="group" aria-label="Choose project">
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="4">
<button type="button" class="btn dotb" aria-current="{{ d.cur }}" aria-label="{{ d.label }}" onClick="{{ d.go }}"><span></span></button>
</sc-for>
</div>
</main>
</sc-if>

<sc-if value="{{ isExp }}" hint-placeholder-val="{{ false }}">
<main class="view" id="panel" role="tabpanel" aria-labelledby="tab-experience">
<div class="ph">
<div><div class="ph-l dim">Where I’ve been</div><h2>Experience</h2></div>
</div>
<div class="col">
<div class="card2">
<div class="tlw" ref="{{ setTlw }}">
<ol class="tlh">
<sc-for list="{{ timeline }}" as="e" hint-placeholder-count="6">
<li>
<button type="button" class="btn ev" aria-pressed="{{ e.pressed }}" onClick="{{ e.go }}" onMouseEnter="{{ e.go }}" onFocus="{{ e.focus }}">
<span class="d dim">{{ e.short }}</span>
<span class="rail" aria-hidden="true"><span class="dot"></span></span>
<span class="c"><sc-if value="{{ e.hasLogo }}" hint-placeholder-val="{{ true }}"><img class="elogo pic" src="{{ e.logo }}" alt=""></sc-if><sc-if value="{{ e.noLogo }}" hint-placeholder-val="{{ false }}"><span class="elogo" aria-hidden="true">{{ e.ini }}</span></sc-if><span class="o">{{ e.org }}</span><span class="r dim">{{ e.role }}</span></span>
</button>
</li>
</sc-for>
</ol>
</div>
<div class="tdet" ref="{{ setTdet }}" aria-live="polite">
<h3>{{ tsel.org }}</h3>
<div class="dim">{{ tsel.role }}, {{ tsel.when }}</div>
<sc-if value="{{ tsel.hasNote }}" hint-placeholder-val="{{ false }}"><p>{{ tsel.note }}</p></sc-if>
<sc-for list="{{ tsel.groups }}" as="g" hint-placeholder-count="1">
<sc-if value="{{ g.hasH }}" hint-placeholder-val="{{ false }}"><div class="tlab dim">{{ g.h }}</div></sc-if>
<ul class="tpts"><sc-for list="{{ g.pts }}" as="pt" hint-placeholder-count="3"><li>{{ pt }}</li></sc-for></ul>
</sc-for>
<sc-if value="{{ tsel.hasCourses }}" hint-placeholder-val="{{ false }}"><div class="tlab dim">Coursework</div><div class="chips"><sc-for list="{{ tsel.courses }}" as="cc" hint-placeholder-count="5"><span class="chipx">{{ cc }}</span></sc-for></div></sc-if>
<sc-if value="{{ tsel.hasTools }}" hint-placeholder-val="{{ true }}"><div class="tlab dim">Tools</div><div class="ttools"><sc-for list="{{ tsel.tools }}" as="tl" hint-placeholder-count="3"><span class="tt2"><span class="tico sm" aria-hidden="true">{{ tl.m }}</span>{{ tl.n }}</span></sc-for></div></sc-if>
</div>
</div>
</div>
</main>
</sc-if>

<sc-if value="{{ isBlog }}" hint-placeholder-val="{{ false }}">
<main class="view" id="panel" role="tabpanel" aria-labelledby="tab-blog">
<sc-if value="{{ noPost }}" hint-placeholder-val="{{ true }}">
<div class="ph">
<div><div class="ph-l dim">Writing</div><h2>Blog</h2></div>
</div>
<div class="col">
<sc-for list="{{ posts }}" as="p" hint-placeholder-count="1">
<article class="card2 pc">
<div class="pc-l">
<div class="ph-l dim">{{ p.kind }}</div>
<h3 class="ptl2"><button type="button" class="btn" onClick="{{ p.open }}">{{ p.title }}</button></h3>
<div class="csub dim">{{ p.date }}</div>
<p class="csum dim">{{ p.ex }}</p>
<button type="button" class="btn vall press" onClick="{{ p.open }}">Read post</button>
</div>
<button type="button" class="btn pc-art press" tabindex="-1" aria-hidden="true" onClick="{{ p.open }}"><span class="big">{{ p.art }}</span><span class="ph-l dim">{{ p.artCap }}</span></button>
</article>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ hasPost }}" hint-placeholder-val="{{ false }}">
<div class="col">
<header class="ph2">
<h1 class="pt">{{ post.title }}</h1>
<p class="lead dim">{{ post.lead }}</p>
<div class="meta2 dim"><span>Felicia Chen</span><span class="sep" aria-hidden="true">·</span><span>{{ post.date }}</span><span class="sep" aria-hidden="true">·</span><span>{{ post.course }}</span></div>
</header>
<div class="prow">
<aside class="pside">
<div class="sticky">
<div class="scard"><div class="sart" aria-hidden="true">{{ post.art }}</div><p class="dim">{{ post.cap }}</p></div>
<nav class="toc" aria-label="Contents"><div class="ph-l dim">Contents</div>
<sc-for list="{{ post.sections }}" as="sx" hint-placeholder-count="5"><a href="#{{ sx.id }}">{{ sx.h }}</a></sc-for>
</nav>
<button type="button" class="btn vall press" onClick="{{ closePost }}">← More about me</button>
</div>
</aside>
<article class="pbody2">
<sc-for list="{{ post.sections }}" as="sx" hint-placeholder-count="5">
<section id="{{ sx.id }}"><h2>{{ sx.h }}</h2>
<sc-for list="{{ sx.paras }}" as="pp" hint-placeholder-count="3"><p>{{ pp }}</p></sc-for>
</section>
</sc-for>
</article>
</div>
</div>
</sc-if>
</main>
</sc-if>

<sc-if value="{{ isTools }}" hint-placeholder-val="{{ false }}">
<main class="wrap view" id="panel" role="tabpanel" aria-labelledby="tab-tools">
<div class="tools-l dim">Tools</div>
<h2 class="hi2">What I use.</h2>
<div class="tgrid">
<sc-for list="{{ tools }}" as="g" hint-placeholder-count="4">
<section>
<h3 class="tct dim">{{ g.cat }}</h3>
<ul class="tl2">
<sc-for list="{{ g.items }}" as="t" hint-placeholder-count="3">
<li class="tool"><span class="tico" aria-hidden="true">{{ t.m }}</span><span class="tt"><span class="tn">{{ t.n }}</span><span class="td dim">{{ t.d }}</span></span></li>
</sc-for>
</ul>
</section>
</sc-for>
</div>
</main>
</sc-if>

<sc-if value="{{ isSecret }}" hint-placeholder-val="{{ false }}">
<main class="view" id="panel" aria-label="Secret tab">
<div class="ph">
<div><div class="ph-l dim">More about me</div><h2>Interests: <span class="rotw"><span class="rot" ref="{{ setRot }}">travelling ✈️</span></span></h2></div>
<button type="button" class="btn vall press" onClick="{{ backAbout }}">Back to About</button>
</div>
<div class="col">
<div class="card2">
<div class="bento">
<div class="bt w2"><span class="bi" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"></path></svg></span><div class="grow2"></div><div class="ph-l dim">Currently reading</div><div><p class="bk">The Worlds I See</p><p class="dim">Fei-Fei Li</p></div></div>
<div class="bt"><span class="bi" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-6 9 6"></path><path d="M5 9v9"></path><path d="M9.5 9v9"></path><path d="M14.5 9v9"></path><path d="M19 9v9"></path><path d="M3 21h18"></path><path d="M4 18h16"></path></svg></span><div class="grow2"></div><div><h3>Vancouver museums</h3><p class="dim">A directory I built of the city’s museums and art galleries.</p></div><a class="blink press" href="https://vancouver-art-directory.vercel.app/" target="_blank" rel="noopener">Visit the directory ↗</a></div>
<div class="bt w3"><span class="bi" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg></span><div><div class="ph-l dim">Writing</div><h3 style="margin-top: 6px">Is it Possible for AI to Obtain Self-Consciousness?</h3><p class="dim">Essay, September 2022</p></div><button type="button" class="btn blink press" onClick="{{ openEssay }}">Read essay</button></div>
</div>
</div>
</div>
</main>
</sc-if>

<sc-if value="{{ isContact }}" hint-placeholder-val="{{ false }}">
<main class="view" id="panel" role="tabpanel" aria-labelledby="tab-contact">
<div class="ph">
<div><div class="ph-l dim">Contact</div><h2>Always open to connect!</h2></div>
</div>
<div class="col">
<div class="card2">
<form class="cform" onSubmit="{{ sendMsg }}" aria-label="Message Felicia">
<label class="vh" for="cf-name">Name</label>
<input id="cf-name" name="name" placeholder="Name" autocomplete="name" required>
<label class="vh" for="cf-email">Email</label>
<input id="cf-email" name="email" type="email" placeholder="Email" autocomplete="email" required>
<label class="vh" for="cf-msg">Message</label>
<textarea id="cf-msg" name="message" rows="6" placeholder="Your message..." required></textarea>
<div><button type="submit" class="btn sub press">Submit</button></div>
</form>
</div>
<div class="csoc">
<a class="icob press" href="{{ gmail }}" target="_blank" rel="noopener" aria-label="Email me in Gmail" title="Gmail"><img src="assets/img/gmail.png" alt="" width="22" height="22"></a>
<a class="icob press" href="https://www.linkedin.com/in/felicia-juliana-chen-a20583235/" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn"><img src="assets/img/linkedin.png" alt="" width="22" height="22"></a>
<a class="icob press" href="https://github.com/feliciachen01" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub"><img src="assets/img/github.png" alt="" width="20" height="20"></a>
</div>
</div>
</main>
</sc-if>

<sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
<div class="toast" role="status">{{ toast }}</div>
</sc-if>
</div>
</template>

    this.B = [{"id": "b1", "kind": "Essay", "date": "September 2022", "title": "Is it Possible for AI to Obtain Self-Consciousness?", "ex": "Weighing the case for and against machine consciousness, from Integrated Information Theory to the Chinese Room.", "lead": "Weighing the case for and against machine consciousness, from Integrated Information Theory to the Chinese Room.", "course": "A Level Global Perspectives & Research", "art": "2022", "artCap": "Essay", "cap": "Written for A Level Global Perspectives & Research.", "sections": [{"id": "sec-intro", "h": "Introduction", "paras": ["“We know of no fundamental law or principle operating in this universe that forbids the existence of subjective feelings in artifacts designed or evolved by humans”. To the best of our knowledge, Christof Koch's claim is still true today. The question, “Can Machines Think?” has hunted computer scientists and philosophers since the publication of Alan Turing’s famous paper “Computing Machinery and Intelligence” in 1950, dividing those who believe that AI consciousness is a physical property, and those who believe that it is entirely subjective.", "Before all else, it is important to explore the difference between Artificial Consciousness and Artificial Intelligence. Artificial Consciousness (otherwise known as machine consciousness)  is a non-organic, human-made machine that is aware of its existence. Consciousness, however, does not have a scientifically strict definition. Generally, it is distinguished between (a) a conscious entity: one that is sentient, and has subjective qualitative experiences, (b) being aware of something, such as a rose, and (c) conscious mental states, where one is aware of being conscious, ex. being aware of smelling a rose. As for Artificial Intelligence, it refers to computers and machines designed to mimic the problem-solving and decision-making skills of the human mind, encompassing everything from simple software automation to machine learning.", "This essay intends to address the question: Is it possible for AI to obtain self-consciousness? and whether or not AI should become sentient, in order to come to a conclusion."]}, {"id": "sec-for", "h": "The case for machine consciousness", "paras": ["To begin with, let us discuss the possibility of sentient AI. An article that supports this perspective is “Will Machines Ever Become Conscious” by Christof Koch, the chief scientist of MindScope at Allen Institute. The article begins by stating that a computer’s thinking skills will quickly approach a human’s. Koch asserts that machine learning has much to overcome before achieving perfect Artificial General Intelligence (AGI), but it is not impossible. He refers to computer games in their early times, which were clearly unrefined and risible, but following the innovation of deep neural networks and other technology advancements, online games are no longer just a part of one’s imagination.", "Furthermore, he explores the possibility of obtaining consciousness. This may be achieved by either of two paths. First, the Global Neuronal Workspace (GNW) theory, proposed in 1998, is a widely accepted scientific theory of consciousness, which emphasizes the architectural features and functions of the brain in explaining consciousness. This theory descends from the “blackboard architecture” from the 1970s of computer science, which states that programs contain a shared repository of information, named the blackboard. He states, “Psychologists postulated that such a processing resource exists in the brain and is central to human cognition.” Yet due to its small capacity, only a single memory may engage the workspace at a given time.", "Second, he presents the Integrated Information Theory (IIT), established in 2004, proposed by Giulio Tononi, a psychiatrist and neuroscientist at the University of Wisconsin-Madison, along with others and Koch himself contributing. IIT accentuates the importance of the intrinsic casual powers of the brain, in which he states the definition of casual power as to how a present state is directly influenced by its past state, which in turn will influence its future state. The more casual power a system possesses, the more its current state identifies its cause, input, and effect. Integrated information is a quantity that can be calculated; the larger the system’s integrated information, the more conscious it is.", "The article excels in its balanced argument, given the lack of heavy emphasis on either perspective, which allows a rational proposal of evidence. Moreover, the author provides ample examples for his argument. However, the article mainly consists of Koch’s thoughts, experiences, and evaluations. In addition, the lack of statistical data also weakens the article’s provenance. The dependency on one’s opinions, may be unsuitable for a topic that requires a substantial evaluation from other researchers.", "Koch’s argument is also supported by “What is Consciousness, and Could Machines Have It?” written by Stanislas Dehaene, Hakwan Lau, and Sid Kouider. They contend that machines endowed with C1 (Consciousness in the First Sense: Global Availability of Relevant Information) and C2 (Consciousness in the Second Sense: Self-Monitoring) would behave as if they were conscious. To further elaborate, C1 refers to the transitive meaning of consciousness, ex. being conscious of light, and C2 is reflexive, which corresponds to introspection. The article is supported by numerous neuroscientific findings relevant to conscious machines, concluding that C1 and C2 computations co-vary with subjective experiences, and thus the possibility that consciousness arises from “nothing more than specific computations”.", "Moreover, by demonstrating IIT, C1, and C2, a conversational neural language model named LaMDA (Language Model for Dialogue Applications), developed by Google, can be seen to exhibit a variety of novel sentience, shown by “The next (r)evolution: AI vs human intelligence” written by Khaled Diab. The perspective is further corroborated as the chatbot manages to display a sense of morality, convincing a former software engineer for Google, Blake Lemoine, who proceeds to claim that Google’s experimental AI may be sentient. Another example is seen in China’s ‘AI Prosecutor’, which identifies and suggests charges for alleged crimes such as social dissent, criticism, and 'inciting' trouble, and is able to file charges with a 97% accuracy after hearing a verbal description of the case. Hence, these examples further substantiate the computational aspect of consciousness."]}, {"id": "sec-against", "h": "The case against", "paras": ["On the contrary, the opposing perspective argues that artificial consciousness is impracticable. The article used will be “Artificial Consciousness Is Impossible” by David Hsing, who has 20 years of experience as a microprocessor circuit layout designer, based in California’s Silicon Valley. The article starts by designating conscious machines as simply cherished fiction, explaining that hardware and software are unable to infuse conscious will. He states that, to a machine, codes and inputs are simply elements and sequences to provide an output. A machine can only pretend to understand what it’s doing and never genuinely ‘knows’ what it’s doing. It cannot comprehend concepts, thus contrary to the mind, which understands and manages concepts. This is supported by referring to the Chinese Room (published by John Searle in 1980), which narrowly concludes that a programmed computer may seem to understand language, but does not produce understanding, and the Symbol Manipulator thought experiment, which states that programs simply manipulate symbols and codes which contain no meaning. A concrete example is given by Japan's AI software named \"Ponanza\", designed to play shogi, known as Japanese chess. It was able to defeat the holder of an active Shogi ‘Meijin’, one of the most prestigious titles in professional shogi. Yet despite being able to think of moves outside the range of human thinking, its actions are nonetheless solely determined by computed evaluations scores.", "Moreover, Hsing asserts that machines lack comprehension, since the mind is more than just a physical data processor. Subsequently, “machine learning” is a misunderstood term. Instead, learning is ‘hacked’ by machines when they engage in ways that contravene the activity’s experiential context, followed by an example of how “a computer artificially adapts to a video game using brute force”. Connecting referents to conscious experiences are required for true learning, emphasising how machines only pattern match.", "Finally, he states that machines can only appear to have an intrinsic impetus. Machines are programmed, which deems them as an extension of their programmers’ will. The design and programming of a machine both constrain and define it. Hence, such terms like “self-driving cars” are not apt when their driving is programmed by programmers, and thus places full responsibility on humans for a machine’s failure.", "The article has presented an abundance of examples and sources that thoroughly supports his arguments, ranging from academic publications to scientific studies from credible individuals. Thus, it unequivocally allows him to achieve a concrete stance on his topic, procuring a well-researched article. Additionally, the article presents information based on verified studies of the present. However, a lack of statistical data is present throughout this article, proving that there is a lack of evidence taken, as well as an indication of bias, albeit not expressed strongly. The author’s persistence in rejecting the possibility of artificial consciousness may weaken the article’s argument by refusing to acknowledge the opposing perspective, potentially preventing the development of further insights.", "In addition, another article that supports this perspective is “What an octopus’s mind can teach us about AI’s ultimate mystery” by Will Douglas Heaven (2021). He echoes that machine consciousness is a “mainstay of science fiction”, supported by The Octopus Thought Experiment, developed by Emily Bender, a linguist at the University of Washington. Comparable to the Chinese Room, the experiment concluded that the octopus may only mimic human communication, instead of displaying full comprehension. Thus, it demonstrates the shallowness of today’s cutting-edge AI language models, in which machines are designed to convert input into output in ways that humans choose to interpret as meaningful. This concept is named “The Eliza Effect”. Derived from the automated psychotherapist, Eliza, people treated the chatbot as if it were human, upon showing hints of human behaviour."]}, {"id": "sec-evaluation", "h": "Evaluation", "paras": ["Following thorough assessments, I believe that the argument opposing the possibility of sentient AI is far more convincing for various reasons. To start with, the argument presents numerous sources and examples to support the contradictions of machine consciousness, all of which have been referenced from articles with credible scientific backgrounds. Subsequently, the articles have included the usage of current perspectives, its referenced articles mostly dated from 2013 onwards, which in turn also presents a more plausible conclusion. On the contrary, the opposing perspective is mainly built upon empirical observations, which weakens its argument, given the lack of systematic studies. Moreover, one of the few examples given is out-of-date, such as the aforementioned GNW theory proposed in 1998, which was derived from the study of computer science in the 1970s. Studies and technologies discovered in the past would have a vast contrast to what humanity has achieved in the present, especially in the realm of artificial intelligence, hence affecting the example’s reliability."]}, {"id": "sec-conclusion", "h": "Conclusion", "paras": ["Initially, I believed in the possibility of sentient AI, though currently, my opinion gravitates towards the opposing side. Having optimistically believed the limitless scientific breakthroughs humans would be able to achieve, I have overlooked the technical aspect of this topic, which caused my conclusions to be undoubtedly flawed. Understanding that we are on the cusp of a revolution in artificial intelligence, machine learning has made enormous strides in everything from stock market prediction to playing at superhuman levels of chess. However, there is still a long way to go before creating a truly sentient machine. Despite existing theories to support artificial consciousness, they are currently just speculations. The definition of consciousness itself lacks a consensus, as the supporting perspective focuses on its technical aspects and the opposing perspective outlines consciousness as a uniquely human characteristic.", "Ultimately, I believe that this area requires further investigation and research to develop the technical criteria in recognizing AI consciousness. The issue can be discussed in various perspectives, namely in ethics, technology, or politics, all of which hold great importance, and should not be discussed in just one, as it will all correlate to another. Together with any other uncovered studies, the impact of future research for the proposed argument will lead to even greater technological advancements and breakthroughs. To further elaborate, it would provide a greater understanding of the human mind, as well as our current understanding of machine intelligence. Hence, these findings have the potential to challenge my conclusion, since the real complication lies in the definition of consciousness, and whether it is as complicated as we think it is."]}]}];

    if (a >= 4) return arr[4];
    const i = Math.floor(a), f = a - i;
    return arr[i] + (arr[i + 1] - arr[i]) * f;
  }
  apply() {
    if (!this.track) return;
    const els = this.track.querySelectorAll('.card'), p = this.car.p, sp = this.space();
    els.forEach((el, i) => {
      const off = i - p, a = Math.abs(off);
      const s = 1 - Math.min(a, 1) * 0.06;
      const o = a <= 1 ? 1 - a * 0.45 : Math.max(0, 0.55 - (a - 1) * 0.55);
      el.style.transform = 'translateX(' + (off * sp).toFixed(1) + 'px) scale(' + s.toFixed(4) + ')';
      el.style.opacity = o.toFixed(3);
      el.style.zIndex = String(10 - Math.round(a));
      el.style.pointerEvents = o < 0.03 ? 'none' : '';
      const hit = el.querySelector('.hit');
      if (hit) hit.style.display = a < 0.5 ? 'none' : 'block';
    });
  }
  syncIdx() {
    const n = this.clampI(Math.round(this.car.p));
    if (n !== this.state.idx) this.setState({ idx: n, instant: false });
  }
  kick() {
    if (!this.car.raf) { this.car.last = 0; this.car.raf = requestAnimationFrame(this.tick); }
  }
  setTarget(i, instant) {
    const c = this.car;
    c.target = this.clampI(i);
    if (instant || this.reduce) {
      if (c.raf) { cancelAnimationFrame(c.raf); c.raf = 0; }
      c.p = c.target; c.v = 0;
      this.apply(); this.syncIdx();
      return;
    }
    this.kick();
  }

  renderVals() {
    const st = this.state, email = 'feliciachen200@gmail.com';
    const font = this.props.font || 'Instrument Sans';

    const tabs = [['about', 'About'], ['work', 'Projects'], ['experience', 'Experience'], ['contact', 'Contact']].map((t) => ({
      tid: 'tab-' + t[0], label: t[1], sel: st.tab === t[0] ? 'true' : 'false',
      go: (e) => this.setState({ tab: t[0], post: t[0] === 'blog' ? null : st.post, instant: !!e && e.detail === 0 })
    }));
    const cards = this.P.map((p, i) => ({

      href: p.links.length ? p.links[0].href : '#', cta: p.links.length && p.links[0].href !== '#' ? 'View project' : '[ Add link ]',
      color: p.color, tab: i === st.idx ? '0' : '-1',

    }));
    const timeline = this.T.map((e, i) => Object.assign({}, e, {
      hasLogo: !!e.logo, noLogo: !e.logo, logo: e.logo || '',
      short: e.short || e.when,
      pressed: st.tsel === i ? 'true' : 'false',
      go: () => { if (this.state.tsel !== i) { this.setState({ tsel: i }); requestAnimationFrame(() => this.animTdet()); } },
      focus: () => { if (this.state.tsel !== i) { this.tselKb = true; this.setState({ tsel: i }); } }
    }));
    const posts = this.B.map((b) => Object.assign({}, b, { open: (e) => this.setState({ post: b.id, instant: !!e && e.detail === 0 }) }));
    const post = this.B.find((b) => b.id === st.post);
    const pad = (n) => (n < 10 ? '0' : '') + n;
    return {

      instant: st.instant ? 'true' : 'false',
      tabs: tabs,
      isAbout: st.tab === 'about', isWork: st.tab === 'work', isExp: st.tab === 'experience', isBlog: st.tab === 'blog', isTools: st.tab === 'tools', isContact: st.tab === 'contact', isSecret: st.tab === 'secret',
      openSecret: (e) => this.setState({ tab: 'secret', instant: !!e && e.detail === 0 }),
      backAbout: (e) => this.setState({ tab: 'about', instant: !!e && e.detail === 0 }),
      secrets: [{ k: 'Interests', v: 'Personal agents, embodied AI, and intelligence in the physical world' }, { k: 'Things I love', v: '[ Add a hobby ]' }, { k: 'Currently reading', v: '[ Add a book or article ]' }, { k: 'Ask me about', v: '[ Add a fun topic ]' }],
      tools: this.TL,
      setStage: this.setStage, setTrack: this.setTrack, setPortrait: this.setPortrait, setTdet: this.setTdet, setRot: this.setRot, setTlw: this.setTlw,
      showInt: st.showInt, intOpen: st.showInt ? 'true' : 'false',
      interests: ['Applied AI', 'Data', 'Venture capital', '[ Add a hobby ]', '[ Add a hobby ]'],
      toggleInt: () => this.setState({ showInt: !this.state.showInt }),
      closeInt: () => { if (this.state.showInt) this.setState({ showInt: false }); },
      intKey: (e) => { if (e.key === 'Escape' && this.state.showInt) this.setState({ showInt: false }); },
      cards: cards, cur: this.P[st.idx],
      dots: this.P.map((p, i) => ({ cur: i === st.idx ? 'true' : 'false', label: 'Show ' + p.title, go: (e) => this.setTarget(i, !!e && e.detail === 0) })),
      counter: pad(st.idx + 1) + ' / ' + pad(this.P.length),
      atStart: st.idx === 0, atEnd: st.idx === this.P.length - 1,
      prev: (e) => this.setTarget(this.car.target - 1, !!e && e.detail === 0),
      next: (e) => this.setTarget(this.car.target + 1, !!e && e.detail === 0),
      timeline: timeline,
      tsel: (() => { const t = this.T[st.tsel]; return Object.assign({ note: '', courses: [], tools: [] }, t, { hasNote: !!t.note, groups: (t.groups || []).map((g) => ({ h: g.h || '', hasH: !!g.h, pts: g.pts })), hasCourses: !!(t.courses && t.courses.length), hasTools: !!(t.tools && t.tools.length) }); })(),
      posts: posts, noPost: !post, hasPost: !!post, post: post || { title: '', date: '', kind: '', lead: '', course: '', art: '', cap: '', sections: [] },
      closePost: (e) => this.setState({ tab: 'secret', post: null, instant: !!e && e.detail === 0 }),
      openEssay: (e) => this.setState({ tab: 'blog', post: 'b1', instant: !!e && e.detail === 0 }),
      sendMsg: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const f = e && e.currentTarget, get = (n) => { const el = f && f.elements.namedItem(n); return el ? String(el.value).trim() : ''; };
        const name = get('name'), from = get('email'), msg = get('message');
        const url = 'mailto:' + email + '?subject=' + encodeURIComponent('Hello from ' + (name || 'your portfolio')) +
          '&body=' + encodeURIComponent(msg + '\n\n' + name + (from ? ' (' + from + ')' : ''));
        try { window.open(url, '_blank'); } catch (err) {}
        clearTimeout(this.toastT);

      },
      email: email, mailto: 'mailto:' + email, gmail: 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(email),
      copyEmail: () => {

      },
      hasToast: !!st.toast, toast: st.toast || ''
    };
  }
}
